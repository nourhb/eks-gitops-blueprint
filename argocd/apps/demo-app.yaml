# Child app: the demo workload, synced from the kubernetes/ directory.
# Safe to use alongside Terraform (Terraform never manages workloads).

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: eks-gitops-blueprint
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # !!! Replace with your fork:
    repoURL: https://github.com/nourhb/eks-gitops-blueprint.git
    targetRevision: main
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: demo-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
