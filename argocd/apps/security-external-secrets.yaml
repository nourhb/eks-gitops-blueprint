# Child app: External Secrets Operator from the upstream Helm chart.
#
# OWNERSHIP: terraform/security.tf installs this same chart by default.
# Use this child INSTEAD of the Terraform helm_release (delete one of
# them), never both. Chart version is pinned to match the Terraform
# default.
#
# NOTE: the IRSA role + SecretsManager policy are created by Terraform
# regardless; if you move ESO fully to Argo CD, keep terraform/security.tf's
# IAM resources and delete only its helm_release block. The service account
# annotation below must reference your role ARN.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security-external-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: eks-gitops-blueprint
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.9.19
    helm:
      values: |
        serviceAccount:
          annotations:
            # !!! Replace with the IRSA role ARN from terraform output:
            eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/blueprint-dev-external-secrets"

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
