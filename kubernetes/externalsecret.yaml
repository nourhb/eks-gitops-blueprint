# External Secrets example for the demo app.
#
# The ClusterSecretStore authenticates to AWS Secrets Manager with the ESO
# controller's IRSA role (provisioned in terraform/security.tf), scoped to
# secrets under `blueprint-dev/*`. The ExternalSecret below syncs the
# `api-key` field of the `blueprint-dev/demo-app` secret into a regular
# Kubernetes Secret named `demo-app-secrets`, refreshed hourly.
#
# Create the AWS secret once, e.g.:
#   aws secretsmanager create-secret --name blueprint-dev/demo-app \
#     --secret-string '{"api-key":"changeme"}' --region ca-central-1
#
# Then reference it from the Deployment:
#   env:
#     - name: API_KEY
#       valueFrom:
#         secretKeyRef: { name: demo-app-secrets, key: api-key }

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ca-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: demo-app-secrets
  namespace: demo-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: demo-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: blueprint-dev/demo-app
        property: api-key
