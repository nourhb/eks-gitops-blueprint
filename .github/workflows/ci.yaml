# -----------------------------------------------------------------------------
# CI — build, test and publish the demo app image to Amazon ECR.
#
# Authentication to AWS uses GitHub OIDC (no long-lived access keys).
# Required repository secret: AWS_ROLE_ARN (IAM role trusting the GitHub OIDC
# provider for this repo). The Terraform in this blueprint does NOT create
# that role — create it once in your account, e.g.:
#
#   aws iam create-role --role-name github-actions-ecr-push ...
#
# Triggered on pull requests and pushes to main.
# -----------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/ci.yaml'

permissions:
  contents: read
  id-token: write   # required for OIDC -> AWS

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: blueprint-dev-demo-app

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check
        run: node --check server.js

      - name: Run tests
        run: npm test --if-present

      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: error

  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'   # PRs only lint/test, never push images
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          echo "tag=v1.0.0-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Building tag: v1.0.0-${SHORT_SHA}"

      - name: Build image
        run: |
          docker build \
            -t "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}" \
            ./app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}"
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Push image to ECR
        run: |
          docker push "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}"

  terraform-security-scan:
    name: Terraform security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov scan (terraform/)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          output_format: cli
          # Soft-fail keeps the pipeline informative without blocking on
          # every medium/low finding; tighten once the baseline is clean.
          soft_fail: true

      - name: tfsec scan (terraform/)
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform
          soft_fail: true
