# -----------------------------------------------------------------------------
# Terraform — plan on pull requests, apply on manual dispatch only.
#
# The plan job runs `fmt -check`, `init`, `validate` and `plan` against the
# real AWS account (read-only) and posts the plan as a PR comment, so every
# infrastructure change is reviewed before it can be applied.
#
# Apply is NEVER automatic: it runs only via "Run workflow" (workflow_dispatch)
# by a maintainer, after the PR is merged.
#
# Required repository secrets:
#   AWS_ROLE_ARN — IAM role trusting GitHub's OIDC provider, with permissions
#                  to manage the resources in terraform/ (VPC, EKS, IAM, ...).
# The S3 backend bucket + DynamoDB lock table (see terraform/backend.tf)
# must already exist, otherwise `terraform init` fails.
# -----------------------------------------------------------------------------

name: Terraform

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yaml'
  workflow_dispatch: # manual apply only

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: ca-central-1
  TF_WORKING_DIR: terraform

jobs:
  plan:
    name: fmt / validate / plan
    runs-on: ubuntu-latest
    # The manual-apply path runs its own plan; the PR path posts a comment.
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive -diff

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const outcome = process.env.PLAN_OUTCOME;
            const body = `### Terraform plan — \`${outcome}\`\n\n` +
              `*Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*\n\n` +
              `<details><summary>Show plan output</summary>\n\n` +
              `\`\`\`\n${{ steps.plan.outputs.stdout }}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: Manual apply
    runs-on: ubuntu-latest
    # Only via the "Run workflow" button, never from a PR or push.
    if: github.event_name == 'workflow_dispatch'
    environment: production # require a manual approver in repo settings
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout (default branch)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve
